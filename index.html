<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Product card</title>
</head>
<body>
  <h1 class="product-card__title">Выбери свой продукт</h1>
  <button id="open-google-button" class="transition-google">открыть google</button>
  <button id="recolor-all-card-button" class="recolor-card-all">перекрасить все карточки</button>
  <button id="recolor-first-card-button" class="recolor-card">перекрасить первую карточку</button>
  <button id="recolor-button" class="repaint-fon">Покрась меня</button>
  <img src="/images/bg-dandelions.png" alt="фон заголовка" class="product-card__img-fon">
  <div class="product-card-wrapper">
    <template id="product-card-template">
      <div class="product-card">
        <img class="product-card__img">
        <p class="product-card__normal-skin"></p>
        <h3 class="product-card__subtitle"></h3>
        <p class="product-card__descr"></p>
        <span class="product-card__compound"></span>
        <ul id="item-list" class="product-card__composition"></ul>
        <div class="product-card__price-wrapper">
          <span class="product-card__price-text">Цена</span>
          <span class="product-card__price"></span>
        </div>
      </div>
    </template>
  </div>
  <script src="/skript.js"></script>
  <script src="/homework-5.js"></script>
  <script src="/homework-6.js"></script>
  <script src="/homework-7.js" type="module"></script>
  <script src="/homework-8.js" type="module"></script>
</body>
</html>
